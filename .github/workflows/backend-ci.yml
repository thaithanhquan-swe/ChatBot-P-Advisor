name: Backend CI/CD

run-name: ${{ github.actor }}

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'server/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'server/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '21'
          cache: 'maven'
          cache-dependency-path: server/pom.xml

      - name: Build with Maven
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress package -DskipTests

      - name: Set up Docker Buildx
        if: ${{ github.event_name == 'push' }}
        uses: docker/setup-buildx-action@v4

      - name: Prepare Docker image tag
        id: docker-image
        if: ${{ github.event_name == 'push' }}
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          test -n "$DOCKER_USERNAME" || { echo "Missing DOCKER_USERNAME secret." >&2; exit 1; }
          test -n "$DOCKER_PASSWORD" || { echo "Missing DOCKER_PASSWORD secret." >&2; exit 1; }

          docker_username=$(printf '%s' "$DOCKER_USERNAME" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')

          if [[ ! "$docker_username" =~ ^[a-z0-9][a-z0-9._-]*$ ]]; then
            echo "DOCKER_USERNAME contains invalid characters. Use only letters, digits, dots, underscores, or hyphens." >&2
            exit 1
          fi

          echo "username=$docker_username" >> "$GITHUB_OUTPUT"
          echo "image=${docker_username}/backend-service" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        if: ${{ github.event_name == 'push' }}
        uses: docker/login-action@v4
        with:
          username: ${{ steps.docker-image.outputs.username }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        if: ${{ github.event_name == 'push' }}
        uses: docker/build-push-action@v7
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ${{ steps.docker-image.outputs.image }}:${{ github.sha }}
