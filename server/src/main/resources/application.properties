
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

server.port=${app.config.server-port}
server.servlet.context-path=${app.config.context-path}
spring.application.name=${app.config.application-name}

spring.datasource.url=${app.config.datasource-url}
spring.datasource.driverClassName=${app.config.datasource-driver}
spring.datasource.username=${app.config.datasource-username}
spring.datasource.password=${app.config.datasource-password}
spring.jpa.hibernate.ddl-auto=${app.config.jpa-ddl-auto}
spring.jpa.show-sql=${app.config.jpa-show-sql}

jwt.signerKey=${app.config.jwt-signer-key}
jwt.valid-duration=${app.config.jwt-valid-duration}
jwt.refreshable-duration=${app.config.jwt-refreshable-duration}

app.frontend-url=${app.config.frontend-url}
app.password-reset.expiration-minutes=${app.config.password-reset-expiration-minutes}
app.email-verification.expiration-minutes=${app.config.email-verification-expiration-minutes:1440}
app.firebase.project-id=${FIREBASE_PROJECT_ID:}
app.firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:}

# Delete guest chat sessions after 24 hours without activity; cleanup runs hourly.
app.chat-session.guest-expiration-hours=${app.config.chat-session-guest-expiration-hours:24}
app.chat-session.cleanup-cron=${app.config.chat-session-cleanup-cron:0 0 * * * *}

app.document.storage-location=${app.config.document-storage-location:uploads/documents}
app.document.ocr.enabled=${app.config.document-ocr-enabled:true}
app.document.ocr.languages=${app.config.document-ocr-languages:vie+eng}
app.document.ocr.data-path=${app.config.document-ocr-data-path:tessdata}
app.document.ocr.max-pages=${app.config.document-ocr-max-pages:30}
app.chat-message.storage-location=${app.config.chat-message-storage-location:uploads/chat-messages}
spring.servlet.multipart.max-file-size=${app.config.document-max-file-size:20MB}
spring.servlet.multipart.max-request-size=${app.config.document-max-request-size:20MB}

spring.mail.host=${app.config.mail-host}
spring.mail.port=${app.config.mail-port}
spring.mail.username=${app.config.mail-username}
spring.mail.password=${app.config.mail-password}
spring.mail.properties.mail.smtp.auth=${app.config.mail-smtp-auth}
spring.mail.properties.mail.smtp.starttls.enable=${app.config.mail-starttls-enable}

# Spring AI / OpenAI. Keep the API key in the environment, never in source control.
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.model=${OPENAI_CHAT_MODEL:gpt-4o-mini}


